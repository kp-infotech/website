# Cloudflare Workers configuration
# @astrojs/cloudflare v13+ deploys via Workers (not Pages).
# The adapter's @cloudflare/vite-plugin generates wrangler.json
# in dist/server/ with the correct assets directory and entrypoint.
name = "website"
main = "src/worker.js"
compatibility_date = "2026-02-11"
compatibility_flags = ["nodejs_compat", "disable_nodejs_process_v2"]

# Let non-static requests fall through to the Worker (default behavior).
# The Astro Worker handles SSR routes (e.g. /studio) and serves 404.astro for unknown routes.
[assets]
run_worker_first = [
  "/services/*",
  "/erp-software",
  "/erp-software/",
  "/odoo-crm",
  "/odoo-crm/",
  "/mobile-web-app",
  "/mobile-web-app/",
  "/career",
  "/career/",
  "/blogs",
  "/blogs/*",
  "/casestudy",
  "/casestudy/*",
  "/hire-wordpress-developer",
  "/hire-wordpress-developer/",
  "/hire-laravel-developer",
  "/hire-laravel-developer/",
  "/hire-react-js-developer",
  "/hire-react-js-developer/",
  "/kp-infotech-faqs",
  "/kp-infotech-faqs/",
]

# Environment variables (available at build time + runtime)
[vars]
PUBLIC_SANITY_PROJECT_ID = "5rux0mv2"
PUBLIC_SANITY_DATASET = "production"
# Analytics — public IDs (consent-gated via CookieYes + hostname-gated to kpinfo.tech).
# Build-time inlined; the local `astro build` reads these from .env, so keep both in sync.
PUBLIC_GA_MEASUREMENT_ID = "G-7K17R4CWQ7"
PUBLIC_CLARITY_ID = "pqpi438d1f"

# Cloudflare Email Sending — exposes env.EMAIL.send() to the Worker (no API key needed).
# Onboard the sending domain once: `npx wrangler email sending enable kpinfo.tech`
[[send_email]]
name = "EMAIL"
